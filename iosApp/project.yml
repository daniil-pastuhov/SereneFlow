name: iosApp
options:
  bundleIdPrefix: com.sereneflow
  developmentLanguage: en
  deploymentTarget:
    iOS: "16.0"
# Version.xcconfig (repository root) holds MARKETING_VERSION for both apps; see the comment there.
configFiles:
  Debug: ../Version.xcconfig
  Release: ../Version.xcconfig
settings:
  base:
    # DEVELOPMENT_TEAM comes from Secrets.xcconfig (git-ignored), included by Version.xcconfig. Don't
    # set it here: project and target settings override the base configuration.
    CODE_SIGN_STYLE: Automatic
    # The Swift targets' text is in String Catalogs, English only for now: Localizable.xcstrings
    # in each target's folder, plus the app's InfoPlist.xcstrings, and its Siri phrases in
    # en.lproj/AppShortcuts.strings (an AppShortcuts.xcstrings catalog needs iOS 17). Shared/ is compiled into the app and the widget, so its strings are in
    # both of their catalogs. A language is added in Xcode's catalog editor, in the same files.
    SWIFT_EMIT_LOC_STRINGS: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      - path: Shared
    dependencies:
      - target: SereneFlowWidget
      # Embedded as the companion watch app (Watch/), installed on a paired Apple Watch.
      - target: SereneFlowWatch
    preBuildScripts:
      - name: "Compile Kotlin/Native Framework"
        script: |
          # Xcode starts with a bare environment; CI sets JAVA_HOME itself.
          if [ -z "$JAVA_HOME" ]; then
            if [ -d "/Library/Java/JavaVirtualMachines/zulu-17.jdk/Contents/Home" ]; then
              export JAVA_HOME="/Library/Java/JavaVirtualMachines/zulu-17.jdk/Contents/Home"
            elif [ -d "/Applications/Android Studio.app/Contents/jbr/Contents/Home" ]; then
              export JAVA_HOME="/Applications/Android Studio.app/Contents/jbr/Contents/Home"
            fi
          fi
          export PATH="$JAVA_HOME/bin:$PATH"
          cd "$SRCROOT/.."
          ./gradlew --no-daemon :composeApp:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        ARCHS: "arm64"
        ONLY_ACTIVE_ARCH: "YES"
        PRODUCT_NAME: "SereneFlow"
        PRODUCT_BUNDLE_IDENTIFIER: "com.sereneflow.timer"
        INFOPLIST_FILE: "iosApp/Info.plist"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        # The per-theme icons (the app icon follows the theme), made by tools/generate_icons.swift.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-OceanMist AppIcon-SunsetClay AppIcon-MidnightStarlight"
        # Simulator builds are ad-hoc signed; the Live Activity extension won't launch unsigned.
        CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
        # The App Group the Quick Start widget reads its routines from. Simulator only for now:
        # device builds need group.com.sereneflow.timer registered for the team (Xcode's Signing &
        # Capabilities, or the developer portal) first; then drop the [sdk=...] qualifier here and
        # on the widget. Without it the widget offers "your last routine" instead of a list.
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: "iosApp/iosApp.entitlements"
        # Only the framework the pre-build script just made for this configuration and SDK, so a
        # Release archive can never link a leftover Debug framework.
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "-framework"
          - "ComposeApp"
        ENABLE_BITCODE: "NO"
  SereneFlowWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: SereneFlowWidget
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: "SereneFlowWidget"
        PRODUCT_BUNDLE_IDENTIFIER: "com.sereneflow.timer.widget"
        INFOPLIST_FILE: "SereneFlowWidget/Info.plist"
        CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
        # See the app target's CODE_SIGN_ENTITLEMENTS.
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: "SereneFlowWidget/SereneFlowWidget.entitlements"
        ARCHS: "arm64"
        ONLY_ACTIVE_ARCH: "YES"
        SKIP_INSTALL: "YES"
  # Apple Watch companion: mirrors the routine running on the iPhone (WatchConnectivity, sent by
  # iosApp/WatchSessionManager.swift). A single-target watchOS app; it doesn't run routines itself.
  SereneFlowWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: SereneFlowWatch
    settings:
      base:
        # Not "SereneFlow": the phone app's product, and the two must not collide in a build folder.
        PRODUCT_NAME: "SereneFlowWatch"
        PRODUCT_BUNDLE_IDENTIFIER: "com.sereneflow.timer.watchkitapp"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "SereneFlow"
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: "com.sereneflow.timer"
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        CODE_SIGN_IDENTITY[sdk=watchsimulator*]: "-"
        SKIP_INSTALL: "YES"
