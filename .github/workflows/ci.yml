name: CI

# Every push and pull request: the shared unit tests and an Android debug build, and an iOS
# simulator build, each only when its files changed (see the "changes" job), and none where another
# run already built the same code:
# - a release/v* pull request: the push run of the same commit builds it, and must, as the publish
#   jobs need it;
# - the push of a pull request's merge commit to main: the pull request's runs built the merge (as
#   of its last push). A release PR's merge is still built, because its pull request runs are the
#   ones skipped above.
# A release/v* push builds both platforms whatever changed, except that the TestFlight archive
# stands in for the iOS build when it runs. macOS minutes cost ten times Linux ones, so anything
# that doesn't need a Mac runs on Linux.
#
# Release flow (scripts/release starts it; see "Releasing" in README.md):
# - Each push to a release/vX.Y.Z branch publishes a signed bundle to the Google Play internal
#   track and, with the IOS_PUBLISH repository variable set to "true", a build to the internal
#   TestFlight testers, both with the notes in release-notes/vX.Y.Z/.
# - Merging that branch's PR promotes the same Play build to closed testing (alpha), submits the
#   newest TestFlight build of the version for App Store review, and tags vX.Y.Z.
# Main itself publishes nothing. The release jobs live in this workflow, not a separate one,
# because the Play version code is derived from this workflow's run number.
on:
  push:
    branches: [main, "release/v*"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull-request runs are cancelled. Pushes are never cancelled, so an upload is never
  # cut off halfway, and neither is the run that promotes a merged release PR.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

jobs:
  changes:
    name: Find what to build
    if: >-
      github.event.action != 'closed' &&
      !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/v')) &&
      !(github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message, 'Merge pull request #') &&
        !contains(github.event.head_commit.message, '/release/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.decide.outputs.android }}
      ios: ${{ steps.decide.outputs.ios }}
    env:
      BUILD_ALL: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release/v') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: env.BUILD_ALL != 'true'
        with:
          # composeApp holds the code of both apps. Version.xcconfig holds the version of both;
          # a change to this workflow builds both.
          filters: |
            android:
              - 'androidApp/**'
              - 'composeApp/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'Version.xcconfig'
              - '.github/workflows/ci.yml'
            ios:
              - 'iosApp/**'
              - 'composeApp/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - 'Version.xcconfig'
              - '.github/workflows/ci.yml'
      - name: Decide
        id: decide
        env:
          ANDROID: ${{ env.BUILD_ALL == 'true' || steps.filter.outputs.android == 'true' }}
          # publish-testflight's archive compiles everything the simulator build does.
          IOS: >-
            ${{ (env.BUILD_ALL == 'true' || steps.filter.outputs.ios == 'true') &&
            !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v') &&
              vars.IOS_PUBLISH == 'true') }}
        run: |
          echo "android=$ANDROID" >> "$GITHUB_OUTPUT"
          echo "ios=$IOS" >> "$GITHUB_OUTPUT"
          echo "Android: $ANDROID, iOS: $IOS"

  android:
    name: Android tests and build
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      # androidApp's debug signing config uses the key alias "debug", and the Android Gradle
      # Plugin only generates a debug keystore by itself for its default alias, so a fresh runner
      # has none. A throwaway one is fine: nothing signed with it leaves the runner.
      - name: Create a debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
            -alias debug -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      # composeApp's commonTest runs on the JVM through its Android host-test target.
      - name: Unit tests and debug build
        run: ./gradlew :composeApp:testAndroidHostTest :androidApp:assembleDebug
      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: composeApp/build/reports/tests/
          retention-days: 7

  ios:
    name: iOS build
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    # Xcode 27.1 (the iOS 27.1 SDK) is what lets the app fill iPhone Duo's inner display; with an
    # older SDK it is kept to a smaller region. macos-latest only has Xcode 26, so the Xcode 27
    # image is used, with 27.1 picked over its default 27.0.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # The Xcode build's pre-build script compiles the Kotlin framework with Gradle.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      # The Kotlin/Native toolchain is a large download; keep it between runs.
      - name: Cache Kotlin/Native
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      # Ad-hoc signed like a local simulator build (project.yml), so no Apple account is needed.
      - name: Build iOS app
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -destination 'generic/platform=iOS Simulator' build

  publish-play:
    name: Publish to Google Play (internal)
    needs: android
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: play-publish
      cancel-in-progress: false
    env:
      # "completed" rolls each build out to the track's testers; the repository variable
      # PLAY_RELEASE_STATUS can set "draft" to leave the rollout to Play Console instead (Play only
      # accepts drafts until the app's first review).
      PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the release version
        run: scripts/check_release_version.sh "${GITHUB_REF_NAME#release/v}"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret for $name"; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > androidApp/release-keystore.jks
          # Read by androidApp/build.gradle.kts with java.util.Properties, which treats "\" as an
          # escape and drops leading spaces: escape both so a password reads back exactly.
          prop() { local v=${1//\\/\\\\}; [[ $v == " "* ]] && v="\\$v"; printf '%s' "$v"; }
          # storeFile is relative to androidApp/.
          printf 'storeFile=release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$(prop "$KEYSTORE_PASSWORD")" "$(prop "$KEY_ALIAS")" "$(prop "$KEY_PASSWORD")" \
            > androidApp/keystore.properties
      - name: Build signed bundle
        # Unique per re-run attempt too: Play refuses a version code it has already accepted.
        run: |
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_ENV"
          ./gradlew :androidApp:bundleRelease -PversionCode=$((100 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Installed in its own step so the Play key is not in the environment while pip runs.
      - name: Install upload dependencies
        run: pip install --quiet google-api-python-client google-auth-httplib2
      - name: Upload to the internal track
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python scripts/play_upload.py \
            --aab androidApp/build/outputs/bundle/release/androidApp-release.aab \
            --mapping androidApp/build/outputs/mapping/release/mapping.txt \
            --track internal \
            --status "$PLAY_RELEASE_STATUS" \
            --release-notes-dir "release-notes/v$RELEASE_VERSION" \
            --release-name "$RELEASE_VERSION ($VERSION_CODE)"
      - name: Keep the bundle
        uses: actions/upload-artifact@v7
        with:
          name: android-release-${{ github.run_number }}
          path: |
            androidApp/build/outputs/bundle/release/androidApp-release.aab
            androidApp/build/outputs/mapping/release/mapping.txt
          retention-days: 14

  publish-testflight:
    name: Publish to TestFlight (internal)
    # No "needs: ios": the archive compiles everything that build would, so it is skipped here.
    # Needs the repository variable IOS_PUBLISH set to "true" and the ASC_* secrets (see
    # store-listing/app-store/README.md).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v') && vars.IOS_PUBLISH == 'true'
    # Same Xcode as the iOS build job, for iPhone Duo (see there).
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    timeout-minutes: 50
    concurrency:
      group: testflight-publish
      cancel-in-progress: false
    outputs:
      build-number: ${{ steps.upload.outputs.build-number }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the release version
        run: scripts/check_release_version.sh "${GITHUB_REF_NAME#release/v}"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache Kotlin/Native
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Restore the App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_P8_BASE64" ]; then echo "::error::Missing secret ASC_KEY_P8_BASE64"; exit 1; fi
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive and upload
        id: upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Chosen here rather than inside ios_release.sh so the next job knows which build to wait for.
          BUILD_NUMBER=$(date -u +%Y%m%d%H%M)
          echo "build-number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          BUILD_NUMBER=$BUILD_NUMBER ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" scripts/ios_release.sh

  # Waiting for App Store Connect to process the upload needs no Mac, so it doesn't hold one.
  testflight-notes:
    name: Hand the TestFlight build to internal testers
    needs: publish-testflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: testflight-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Restore the App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install App Store Connect API dependencies
        run: pip install --quiet cryptography
      - name: Set What to Test and hand the build to internal testers
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_NUMBER: ${{ needs.publish-testflight.outputs.build-number }}
        run: |
          VERSION=${GITHUB_REF_NAME#release/v}
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" python scripts/testflight.py notes \
            --version "$VERSION" --build "$BUILD_NUMBER" --notes-dir "release-notes/v$VERSION"

  # --- Merged release PR: move the tested builds on to Play closed testing and the App Store ----

  promote-play:
    name: Promote to Google Play closed testing
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.merged && startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: play-publish
      cancel-in-progress: false
    env:
      PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Check the release version
        run: scripts/check_release_version.sh "${GITHUB_HEAD_REF#release/v}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install upload dependencies
        run: pip install --quiet google-api-python-client google-auth-httplib2
      # The newest internal release of this version is the build testers have been trying; it is
      # promoted as is rather than rebuilt from the merge commit.
      - name: Promote internal to closed testing
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python scripts/play_upload.py \
            --promote-from internal --version "$RELEASE_VERSION" \
            --track alpha \
            --status "$PLAY_RELEASE_STATUS" \
            --release-notes-dir "release-notes/v$RELEASE_VERSION"

  # The upload and the wait for its processing are separate jobs, so the testflight-publish group
  # alone could let release-app-store run between them and submit an older build. This waits for
  # the release branch's runs to finish first, outside that group: inside it, it would hold the
  # group that the run it waits for still needs.
  wait-for-testflight:
    name: Wait for the release branch's TestFlight upload
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.merged && startsWith(github.head_ref, 'release/v') &&
      vars.IOS_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
    steps:
      - name: Wait for the release branch's runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while [ -n "$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$GITHUB_HEAD_REF" \
                       --event push --json status --jq '.[] | select(.status != "completed") | .status')" ]; do
            echo "A $GITHUB_HEAD_REF run is still going; checking again in 30 s"
            sleep 30
          done

  release-app-store:
    name: Submit to the App Store
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.merged && startsWith(github.head_ref, 'release/v') &&
      vars.IOS_PUBLISH == 'true'
    needs: wait-for-testflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: testflight-publish
      cancel-in-progress: false
    env:
      # "AFTER_APPROVAL" goes live as soon as App Review approves; the repository variable
      # APP_STORE_RELEASE_TYPE can set "MANUAL" to release it from App Store Connect instead.
      APP_STORE_RELEASE_TYPE: ${{ vars.APP_STORE_RELEASE_TYPE || 'AFTER_APPROVAL' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Check the release version
        run: scripts/check_release_version.sh "${GITHUB_HEAD_REF#release/v}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install App Store Connect API dependencies
        run: pip install --quiet cryptography
      - name: Submit the newest build for App Review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" python scripts/testflight.py appstore \
            --version "$RELEASE_VERSION" --notes-dir "release-notes/v$RELEASE_VERSION" \
            --release-type "$APP_STORE_RELEASE_TYPE"

  tag-release:
    name: Tag the release
    needs: [promote-play, release-app-store]
    # Tagged once Play has the release; an App Store failure is reported by its own job and can be
    # re-run without moving the tag that scripts/release counts the next release's commits from.
    if: ${{ !cancelled() && needs.promote-play.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Tag and create a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          VERSION=${GITHUB_HEAD_REF#release/v}
          gh release create "v$VERSION" --target "$MERGE_SHA" --title "$VERSION" \
            --notes-file "release-notes/v$VERSION/en-US.txt"
